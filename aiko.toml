# Aiko – místní chat, který ovládá tento počítač (a spárované počítače přes Aiko Link).
# Chat a API poslouchají jen na 127.0.0.1. Do sítě je vystavená jen šifrovaná brána Aiko Link,
# a to až po spárování prvního počítače.

[aiko]
user_name = ""                  # jméno (osobní hodnoty patří do aiko.user.toml – git ho ignoruje)
greeting = ""                   # oslovení v 5. pádě, např. "Adame"
home_city = ""
host = "127.0.0.1"
port = 8770
data_dir = "data"

[model]
ollama_url = "http://localhost:11434"
# Qwen3.5 4B: text + obrázky + nástroje, celý se vejde do 6 GB grafiky (≈3,3 GB)
standard = "qwen3.5:4b"         # (úrovně myšlení a jejich modely: aiko/server/hardware.py)
# Necenzurovaná verze stejného modelu (abliterated) – přepíná se v aplikaci
uncensored = "huihui_ai/qwen3.5-abliterated:4b"
num_ctx = 8192
keep_alive = "30m"

[agent]                         # klikání po obrazovce (stejný model jako chat)
max_steps = 25

[voice]
piper_model = "voices/cs_CZ-jirka-medium.onnx"   # hlas Jirka (Piper), běží místně
speech_rate = 1.0

[link]
port = 8771                     # TLS brána pro spárované počítače
udp_port = 8772                 # probouzení spárovaných počítačů
