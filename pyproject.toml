[project]
name = "aiko-lan"
version = "0.1.0"
description = "Aiko LAN – lokální AI orchestrátor pro opravu telefonů a počítačů seniorů"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "zeroconf>=0.131",
    "pillow>=10.1",            # Set-of-Marks (štítky do snímku obrazovky)
]

[project.optional-dependencies]
# Hlas na serveru (Faster-Whisper STT). Piper TTS se volá jako binárka, viz README.
voice = ["faster-whisper>=1.0"]
# Porozumění a GUI agent přes Claude API (jinak Ollama / Gemini / klíčová slova).
claude = ["anthropic>=0.60"]
# GUI agent na počítači: snímek obrazovky, prvky oken, myš a klávesnice.
# winrt-* = vestavěné OCR Windows 10/11 (nápisy ze snímku v jakékoli aplikaci) – nic se neinstaluje do Windows.
pc = ["mss>=9", "pyautogui>=0.9.54", "pywinauto>=0.6.8; sys_platform == 'win32'",
      "winrt-runtime>=3; sys_platform == 'win32'",
      "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
      "winrt-Windows.Foundation.Collections>=3; sys_platform == 'win32'",
      "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
      "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
      "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
      "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["aiko*"]

[tool.setuptools.package-data]
"aiko.server" = ["static/*"]
"aiko" = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "raspberry_pi"]   # server + firmware tlačítka na Pi
