[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiko"
version = "2.0.0"
description = "Aiko – místní AI chat, který ovládá tento počítač i spárované počítače v síti"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pillow>=10.1",
    "cryptography>=42",        # certifikát pro šifrovanou bránu Aiko Link
    "piper-tts>=1.2",          # hlas Jirka
    "numpy>=1.26",
]

[project.optional-dependencies]
# Volitelně cloudové modely pro klikání po obrazovce (jinak místní Ollama).
claude = ["anthropic>=0.60"]
# GUI agent na počítači: snímek obrazovky, prvky oken, myš a klávesnice.
# winrt-* = vestavěné OCR Windows 10/11 (nápisy ze snímku v jakékoli aplikaci) – nic se neinstaluje do Windows.
pc = ["mss>=9", "psutil>=5.9", "pyautogui>=0.9.54", "pywinauto>=0.6.8; sys_platform == 'win32'",
      "winrt-runtime>=3; sys_platform == 'win32'",
      "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
      "winrt-Windows.Foundation.Collections>=3; sys_platform == 'win32'",
      "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
      "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
      "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
      "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["aiko*"]

[tool.setuptools.package-data]
"aiko.server" = ["static/*"]
"aiko" = ["skills/*/SKILL.md", "link/install/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
