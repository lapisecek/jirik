<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title></title>
<style>
  /* Rámeček kolem obrazovky, když Aiko ovládá počítač. Plná barva, žádná záře.
     Kliky jdou skrz a na snímcích obrazovky pro model není vidět. */
  :root { --accent: #E0492A; --out: cubic-bezier(.16, 1, .3, 1); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .edge { position: fixed; background: var(--accent); transition: transform .7s var(--out); }
  .t, .b { left: 0; right: 0; height: 3px; transform: scaleX(0); }
  .l, .r { top: 0; bottom: 0; width: 3px; transform: scaleY(0); }
  .t { top: 0; transform-origin: left; } .b { bottom: 0; transform-origin: right; }
  .l { left: 0; transform-origin: bottom; } .r { right: 0; transform-origin: top; }
  .on .t, .on .b { transform: scaleX(1); } .on .l, .on .r { transform: scaleY(1); }
  .on .r { transition-delay: .08s; } .on .b { transition-delay: .16s; } .on .l { transition-delay: .24s; }
  /* jezdec po horní hraně – ukazuje, že se pracuje */
  .run { position: fixed; top: 0; left: 0; height: 3px; width: 18vw; background: #1B1A17; opacity: 0; transition: opacity .4s; }
  .on .run { opacity: .55; animation: run 2.4s cubic-bezier(.65,0,.35,1) infinite alternate; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(82vw); } }
  @media (prefers-reduced-motion: reduce) { .on .run { animation: none; } }
</style>
</head>
<body>
<div class="edge t"></div><div class="edge r"></div><div class="edge b"></div><div class="edge l"></div><div class="run"></div>
<script>
function setOn(on) { document.body.classList.toggle("on", on); }
</script>
</body>
</html>
