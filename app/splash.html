<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Aiko</title>
<style>
  :root { --bg: #f6f7f9; --ink: #15171a; --mute: #6b7280; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --ink: #e9ebef; --mute: #9aa1ad; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         display: grid; place-items: center; -webkit-app-region: drag; user-select: none; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .orb { width: 84px; height: 84px; border-radius: 50%; position: relative;
         background: radial-gradient(circle at 35% 30%, #9aacff, #4f6bed 60%, #7c4de6);
         animation: pulse 1.8s ease-out infinite; }
  .orb::after { content: ""; position: absolute; inset: 29px; border-radius: 50%; background: #fff; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79,107,237,.5); transform: scale(.96); }
                     70% { box-shadow: 0 0 0 26px rgba(79,107,237,0); transform: scale(1); }
                     100% { box-shadow: 0 0 0 0 rgba(79,107,237,0); transform: scale(.96); } }
  h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -.02em; }
  #status { color: var(--mute); min-height: 22px; text-align: center; max-width: 420px; transition: opacity .2s; }
  #status.err { color: var(--bad); }
  .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(127,127,127,.18); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px;
           background: linear-gradient(90deg, #6d84ff, #b06dff); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .err ~ .bar, body.failed .bar { display: none; }
  body.failed .orb { animation: none; filter: grayscale(.6); }
</style>
</head>
<body>
<div class="box">
  <div class="orb"></div>
  <h1>Aiko</h1>
  <div id="status">Spouštím…</div>
  <div class="bar"><i></i></div>
</div>
<script>
function setStatus(text, error) {
  const s = document.getElementById("status");
  s.style.opacity = 0;
  setTimeout(() => { s.textContent = text; s.classList.toggle("err", !!error); s.style.opacity = 1; }, 150);
  document.body.classList.toggle("failed", !!error);
}
</script>
</body>
</html>
