<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Jiřík</title>
<style>
  :root { --paper: #F4F2EE; --ink: #1B1A17; --mute: #8A867D; --line: #E2DED6; --accent: #E0492A; --bad: #C8361B;
          --out: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.22, 1.18, .36, 1); }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #131210; --ink: #EEEBE4; --mute: #8C877C; --line: #2A2824; --accent: #F0603E; --bad: #F06A4C; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); display: grid; place-items: center; -webkit-app-region: drag;
         user-select: none; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .box { display: flex; flex-direction: column; align-items: center; }
  .mark { width: 64px; height: 64px; flex: none; }
  .mark svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .mark .hd { transform-origin: 16px 27px; }
  .mark .face, .mark .ear { fill: var(--accent); transition: fill .5s; }
  .mark .cap { fill: #2B2824; }
  .mark .stache, .mark .brows { fill: #F4F2EE; transform-origin: 16px 24px; }
  .mark .seam { fill: none; stroke: rgba(244,242,238,.16); stroke-width: .8; stroke-linecap: round; }
  .mark .specs circle { fill: none; stroke: #F4F2EE; stroke-width: 1.45; }
  .mark .specs path { fill: none; stroke: #F4F2EE; stroke-width: 1.3; stroke-linecap: round; }
  .mark .eyes { fill: #1B1A17; transform-box: fill-box; transform-origin: center; animation: blink 5.5s 1.2s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes nod { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg) translateY(.4px); }
                   50% { transform: rotate(0) translateY(.9px); } 75% { transform: rotate(7deg) translateY(.4px); } }
  @keyframes twitch { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.12) scaleY(.92); } }
  .mark { animation: pop .8s var(--spring) both; }
  .mark .hd { animation: nod 1.5s cubic-bezier(.45,0,.55,1) .5s infinite; }
  .mark .stache { animation: twitch 1.5s cubic-bezier(.45,0,.55,1) .5s infinite; }
  @media (prefers-color-scheme: dark) { .mark .cap { fill: #5E574D; } }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  h1 { font: 600 26px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.02em; margin: 26px 0 0;
       animation: up .7s .1s var(--out) both; }
  #status { margin-top: 10px; color: var(--mute); min-height: 21px; text-align: center; max-width: 420px;
            transition: opacity .2s, transform .3s var(--out); animation: up .7s .18s var(--out) both; }
  #status.err { color: var(--bad); }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }
  .bar { width: 160px; height: 2px; background: var(--line); margin-top: 22px; overflow: hidden; border-radius: 2px;
         animation: up .7s .26s var(--out) both; }
  .bar i { display: block; width: 36%; height: 100%; background: var(--ink); border-radius: 2px;
           animation: slide 1.25s var(--out) infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  body.failed .bar { opacity: 0; } body.failed .mark .hd, body.failed .mark .stache { animation: none; }
</style>
</head>
<body>
<div class="box">
  <div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><g class="hd"><circle class="ear" cx="4.3" cy="19.6" r="2.3"/><circle class="ear" cx="27.7" cy="19.6" r="2.3"/><circle class="face" cx="16" cy="18" r="12.2"/><path class="cap" d="M4.1 14.3C4.4 8.7 9.1 5.3 16.2 5.3c6.9 0 11.6 3.1 11.8 8.6 1.5.4 2.1 1.4 1.4 2.3-8.1-1.6-18.6-1.6-26.7.2-.7-.9-.2-1.8 1.4-2.1Z"/><path class="seam" d="M5.6 13.4c5.6-1.9 15.2-1.9 20.8-.2"/><path class="brows" d="M8.2 17.3c1.2-1.6 3.7-2 6-1 .3.2.2.6-.1.6-1.9-.3-3.8 0-5.5.8-.3.1-.5-.2-.4-.4ZM23.8 17.3c-1.2-1.6-3.7-2-6-1-.3.2-.2.6.1.6 1.9-.3 3.8 0 5.5.8.3.1.5-.2.4-.4Z"/><g class="eyes"><circle cx="11.7" cy="19.7" r="1"/><circle cx="20.3" cy="19.7" r="1"/></g><g class="specs"><circle cx="11.7" cy="19.7" r="3.1"/><circle cx="20.3" cy="19.7" r="3.1"/><path d="M14.8 19.5q1.2-.9 2.4 0"/></g><path class="stache" d="M16 23.3c-1.4-1.2-3.6-1.3-5.2-.2-1 .7-2 1-3 .8 1.1 2.2 3.8 2.8 5.8 1.8 1-.5 1.8-1 2.4-1.5.6.5 1.4 1 2.4 1.5 2 1 4.7.4 5.8-1.8-1 .2-2-.1-3-.8-1.6-1.1-3.8-1-5.2.2Z"/></g></svg></div>
  <h1>Jiřík</h1>
  <div id="status">Spouštím…</div>
  <div class="bar"><i></i></div>
</div>
<script>
function setStatus(text, error) {
  const s = document.getElementById("status");
  s.style.opacity = 0; s.style.transform = "translateY(-4px)";
  setTimeout(() => { s.textContent = text; s.classList.toggle("err", !!error); s.style.opacity = 1; s.style.transform = "none"; }, 160);
  document.body.classList.toggle("failed", !!error);
}
</script>
</body>
</html>
