<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title></title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
               font: 14px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .pill { position: absolute; inset: 6px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 10px;
          border-radius: 999px; color: #f3f4f8; background: rgba(22, 24, 32, .86);
          border: 1px solid rgba(255,255,255,.12); box-shadow: 0 8px 28px rgba(0,0,0,.35);
          backdrop-filter: blur(18px); opacity: 0; transform: translateY(-10px) scale(.97);
          transition: opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .shown .pill { opacity: 1; transform: none; }
  .orb { width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative;
         background: conic-gradient(from 0deg, #6d84ff, #a86dff, #ff6dbd, #ffad6d, #6dd6ff, #6d84ff);
         animation: rot 1.6s linear infinite; }
  .orb::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #161820; }
  .done .orb { animation: none; background: #1f9d55; }
  .done .orb::after { inset: 0; background: none;
    content: "✓"; color: #fff; font-weight: 700; display: grid; place-items: center; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .txt { flex: 1; min-width: 0; }
  .title { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .6; }
  .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: #fff; background: #dc2626; border: 0; border-radius: 999px; padding: 7px 14px;
           cursor: pointer; transition: transform .1s, opacity .2s; }
  button:active { transform: scale(.95); }
  .done button { display: none; }
</style>
</head>
<body>
<div class="pill" id="pill" title="Otevřít chat Aiko">
  <div class="orb"></div>
  <div class="txt"><div class="title" id="title">Aiko pracuje na počítači</div><div class="msg" id="msg">…</div></div>
  <button id="stop" title="Zastavit Aiko">Stop</button>
</div>
<script>
const $ = id => document.getElementById(id);
function setPill(state, text) {
  document.body.classList.add("shown");
  document.body.classList.toggle("done", state === "done");
  $("title").textContent = state === "done" ? "Aiko je hotová" : "Aiko pracuje na počítači";
  $("msg").textContent = text || "";
}
$("pill").onclick = e => { if (e.target.id !== "stop") window.aiko.open(); };
$("stop").onclick = () => { window.aiko.stop(); $("msg").textContent = "Zastavuji…"; };
</script>
</body>
</html>
