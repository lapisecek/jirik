name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[pc,dev]" pyflakes

      - name: Static checks and tests
        run: |
          python -m pyflakes aiko run.py tests
          python -m pytest -q
          node --check app/main.js
          node --check app/preload.js
          node --check app/preload-ui.js
          node --check app/make_icon.js
